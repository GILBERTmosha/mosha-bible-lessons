<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mosha Bible Lessons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-container h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-container .form-group {
            margin-bottom: 20px;
        }

        .login-container label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .login-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .login-container button:hover {
            transform: translateY(-2px);
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
        }

        .message.error {
            background: #ffe0e0;
            color: #c92a2a;
            border-left: 5px solid #c92a2a;
            display: block;
        }

        .message.success {
            background: #d3f9d8;
            color: #2f9e44;
            border-left: 5px solid #2f9e44;
            display: block;
        }

        /* Admin Dashboard */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }

        .admin-header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: #667eea;
            font-size: 1.8em;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 4px solid #667eea;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #666;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .form-group button:hover {
            transform: translateY(-2px);
        }

        .lessons-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .lessons-list h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .lesson-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid #667eea;
        }

        .lesson-item h4 {
            color: #764ba2;
            margin-bottom: 10px;
        }

        .lesson-item .verse {
            color: #667eea;
            font-style: italic;
            margin-bottom: 10px;
        }

        .lesson-item .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .lesson-item .actions button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .delete-btn:hover {
            background: #ff5252;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div class="login-container" id="loginSection">
        <h1>🔐 Admin Panel</h1>
        <div class="message" id="loginMessage"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">🔑 Password ya Admin:</label>
                <input type="password" id="password" placeholder="Ingiza password" required>
            </div>
            <button type="submit">🔓 Ingia</button>
        </form>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1>📊 Admin Panel - Mosha Bible Lessons</h1>
            <button class="logout-btn" onclick="logout()">🚪 Toka</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalUsers">0</h3>
                <p>👥 Watumiaji Jumla</p>
            </div>
            <div class="stat-card">
                <h3 id="subscribedUsers">0</h3>
                <p>📧 Wanasoma Masomo</p>
            </div>
            <div class="stat-card">
                <h3 id="totalLessons">0</h3>
                <p>📚 Masomo Jumla</p>
            </div>
        </div>

        <!-- Create Lesson Form -->
        <div class="form-section">
            <h2>➕ Tengeneza Somo Mpya</h2>
            <div id="createMessage"></div>
            <form id="createLessonForm">
                <div class="form-group">
                    <label for="title">📖 Jina la Somo:</label>
                    <input type="text" id="title" placeholder="mfano: Upendo wa Mungu" required>
                </div>

                <div class="form-group">
                    <label for="bibleVerse">✝️ Ayat ya Bibilia:</label>
                    <input type="text" id="bibleVerse" placeholder="mfano: 1 Yohana 4:8" required>
                </div>

                <div class="form-group">
                    <label for="content">📝 Mafunzo:</label>
                    <textarea id="content" placeholder="Andika mafunzo ya somo..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="dailyWord">💭 Neno la Kila Siku:</label>
                    <textarea id="dailyWord" placeholder="Andika neno la kila siku..." required></textarea>
                </div>

                <div class="form-group">
                    <button type="submit">✅ Weka Somo</button>
                </div>
            </form>
        </div>

        <!-- Lessons List -->
        <div class="lessons-list">
            <h2>📚 Masomo Yote</h2>
            <div id="lessonsList" class="loading">
                <p>Inapakua masomo...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let authToken = localStorage.getItem('adminToken');

        // Check if already logged in
        if (authToken) {
            showAdminPanel();
            loadStats();
            loadLessons();
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (response.ok) {
                    authToken = result.token;
                    localStorage.setItem('adminToken', authToken);
                    showAdminPanel();
                    loadStats();
                    loadLessons();
                    showMessage('✅ Welcome! Karibu Admin!', 'success', 'loginMessage');
                } else {
                    showMessage('❌ Password si sahihi!', 'error', 'loginMessage');
                }
            } catch (error) {
                showMessage('❌ Hitilafu: ' + error.message, 'error', 'loginMessage');
            }

            document.getElementById('password').value = '';
        });

        // Create Lesson
        document.getElementById('createLessonForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const lesson = {
                title: document.getElementById('title').value,
                bible_verse: document.getElementById('bibleVerse').value,
                content: document.getElementById('content').value,
                daily_word: document.getElementById('dailyWord').value
            };

            try {
                const response = await fetch(`${API_URL}/api/lessons`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(lesson)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('✅ Somo limewekwa! Barua zimetumwa kwa watumiaji! 🎉', 'success', 'createMessage');
                    document.getElementById('createLessonForm').reset();
                    loadLessons();
                    loadStats();
                } else {
                    showMessage('❌ ' + result.error, 'error', 'createMessage');
                }
            } catch (error) {
                showMessage('❌ Hitilafu: ' + error.message, 'error', 'createMessage');
            }
        });

        // Load Stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('totalUsers').textContent = stats.totalUsers;
                    document.getElementById('subscribedUsers').textContent = stats.subscribedUsers;
                    document.getElementById('totalLessons').textContent = stats.totalLessons;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load Lessons
        async function loadLessons() {
            try {
                const response = await fetch(`${API_URL}/api/lessons`);
                const lessons = await response.json();

                let html = '';
                if (lessons.length === 0) {
                    html = '<p style="color: #999; text-align: center;">Hakuna masomo bado</p>';
                } else {
                    lessons.reverse().forEach(lesson => {
                        html += `
                            <div class="lesson-item">
                                <h4>${lesson.title}</h4>
                                <div class="verse">✝️ ${lesson.bible_verse}</div>
                                <p>${lesson.content.substring(0, 100)}...</p>
                                <div class="actions">
                                    <button class="delete-btn" onclick="deleteLesson('${lesson._id}')">
                                        🗑️ Futa
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }

                document.getElementById('lessonsList').innerHTML = html;
            } catch (error) {
                console.error('Error loading lessons:', error);
            }
        }

        // Delete Lesson
        async function deleteLesson(id) {
            if (confirm('Taka kufuta somo hili?')) {
                try {
                    const response = await fetch(`${API_URL}/api/lessons/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });

                    if (response.ok) {
                        showMessage('✅ Somo lifufutwa!', 'success', 'createMessage');
                        loadLessons();
                        loadStats();
                    } else {
                        showMessage('❌ Kosa katika kufuta!', 'error', 'createMessage');
                    }
                } catch (error) {
                    showMessage('❌ Hitilafu: ' + error.message, 'error', 'createMessage');
                }
            }
        }

        // Show Admin Panel
        function showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
        }

        // Logout
        function logout() {
            if (confirm('Taka kuondoka?')) {
                localStorage.removeItem('adminToken');
                authToken = null;
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('adminContainer').style.display = 'none';
                document.getElementById('loginForm').reset();
                document.getElementById('password').focus();
            }
        }

        // Show Message
        function showMessage(text, type, elementId) {
            const element = document.getElementById(elementId);
            element.textContent = text;
            element.className = `message ${type}`;
            setTimeout(() => {
                element.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
