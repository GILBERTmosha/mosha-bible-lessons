<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chati Siri Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card: #13131a;
      --border: #1f1f2e;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #e4e7;
      --text-muted: #71717a;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

  .container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

  .header {
      padding: 20px;
      background: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

  .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

  .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px;
    }

  .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

  .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

  .status-dot.online { background: var(--success); }

    #loginSection, #roomSection {
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  .welcome-text {
      margin-bottom: 20px;
    }

  .welcome-text h2 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #chatSection { display: none; flex: 1; flex-direction: column; }

  .room-info {
      padding: 16px 20px;
      background: rgba(99, 102, 241, 0.1);
      border-bottom: 1px solid var(--border);
    }

  .room-code-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #roomCode {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--primary);
      font-family: 'Courier New', monospace;
    }

  .share-btn {
      padding: 8px 16px;
      font-size: 13px;
      background: var(--primary);
    }

  .users-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

  .user-badge {
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

  .user-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

  .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.5;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

  .msg-header {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.7;
    }

  .me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-bottom-right-radius: 4px;
    }

  .other {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border-bottom-left-radius: 4px;
    }

  .system {
      align-self: center;
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
    }

  .msg img {
      max-width: 100%;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
    }

  .oneview {
      filter: blur(20px);
      transition: 0.3s;
    }

  .oneview.viewed { filter: none; }

  .oneview-label {
      font-size: 10px;
      background: var(--danger);
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 8px;
      font-weight: 600;
    }

  .typing-indicator {
      padding: 0 20px 12px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      min-height: 20px;
    }

    #inputArea {
      padding: 16px 20px;
      background: rgba(19, 19, 26, 0.8);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }

  .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

  .input-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"], input[type="text"]::placeholder {
      font-family: 'Inter', sans-serif;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    button {
      padding: 14px 24px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: var(--border);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

  .file-btn {
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

  .file-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    #fileInput { display: none; }

  .small {
      font-size: 13px;
      color: var(--text-muted);
    }

  .checkbox-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

  .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 8px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

  .divider::before,
  .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

  .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      z-index: 1000;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon">🔒</div>
          <span>Chati Siri</span>
        </div>
        <div id="status">
          <div class="status-dot"></div>
          <span>Connecting...</span>
        </div>
      </div>
    </div>

    <div id="loginSection">
      <div class="welcome-text">
        <h2>Karibu Chati Siri</h2>
        <p class="small">Chat ya siri kwa watu 3. Hakuna historia, hakuna trace.</p>
      </div>
      <input id="userName" type="text" placeholder="Andika jina lako" maxlength="20">
      <button onclick="saveName()">Endelea</button>
    </div>

    <div id="roomSection" style="display: none;">
      <div class="welcome-text">
        <h2>Hujambo <span id="displayName"></span>!</h2>
        <p class="small">Tengeneza room mpya au jiunge na room</p>
      </div>
      <button onclick="createRoom()">✨ Tengeneza Room Mpya</button>
      <div class="divider">au</div>
      <input id="joinCode" type="text" placeholder="Weka Room Code au Link" maxlength="6">
      <button onclick="joinRoom()">🚀 Jiunge na Room</button>
    </div>

    <div id="chatSection">
      <div class="room-info">
        <div class="room-code-display">
          <div>
            <div class="small">Room Code</div>
            <div id="roomCode"></div>
          </div>
          <button class="share-btn" onclick="copyLink()">📋 Share Link</button>
        </div>
        <div class="users-list" id="usersList"></div>
      </div>
      <div id="messages"></div>
      <div class="typing-indicator" id="typingIndicator"></div>
      <div id="inputArea">
        <div class="input-wrapper">
          <div class="input-left">
            <input id="msgInput" type="text" placeholder="Andika ujumbe..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
            <div class="checkbox-area">
              <input type="checkbox" id="oneViewCheck">
              <label for="oneViewCheck">👁️ One-View - Ifutike baada ya kuona</label>
            </div>
          </div>
          <label for="fileInput" class="file-btn">📎</label>
          <input type="file" id="fileInput" accept="image/*">
          <button onclick="sendMsg()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getDatabase, ref, set, push, onChildAdded, onDisconnect, remove, get, update, onValue, onChildRemoved } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBhgjO4_fbH9s8Rz7zWwrDiqg6MSiKrF0U",
      authDomain: "chati-siri.firebaseapp.com",
      databaseURL: "https://chati-siri-default-rtdb.firebaseio.com",
      projectId: "chati-siri",
      storageBucket: "chati-siri.appspot.com",
      messagingSenderId: "668482838773",
      appId: "1:668482838773:web:fb39fbbc644f46bf9a25bc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let currentRoom = null;
    let userName = '';
    let userColor = '';
    let typingTimeout = null;

    const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];

    const statusEl = document.getElementById('status');
    const loginSection = document.getElementById('loginSection');
    const roomSection = document.getElementById('roomSection');
    const chatSection = document.getElementById('chatSection');
    const messagesEl = document.getElementById('messages');
    const fileInput = document.getElementById('fileInput');
    const typingIndicator = document.getElementById('typingIndicator');

    // Check URL for room code
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.querySelector('.status-dot').classList.add('online');
        statusEl.querySelector('span').textContent = 'Online';

        // Check saved name
        const savedName = localStorage.getItem('chatName');
        if (savedName) {
          userName = savedName;
          userColor = localStorage.getItem('chatColor') || colors[0];
          showRoomSection();
          if (roomFromUrl) {
            document.getElementById('joinCode').value = roomFromUrl;
            joinRoom();
          }
        }
      } else {
        signInAnonymously(auth).catch(err => {
          statusEl.querySelector('span').textContent = 'Error: Washa Anonymous';
        });
      }
    });

    window.saveName = () => {
      const name = document.getElementById('userName').value.trim();
      if (!name) return alert('Weka jina lako kwanza');
      if (name.length < 2) return alert('Jina liwe na herufi 2+');

      userName = name;
      userColor = colors[Math.floor(Math.random() * colors.length)];
      localStorage.setItem('chatName', userName);
      localStorage.setItem('chatColor', userColor);
      showRoomSection();
    };

    function showRoomSection() {
      loginSection.style.display = 'none';
      roomSection.style.display = 'flex';
      document.getElementById('displayName').textContent = userName;
    }

    window.createRoom = async () => {
      if (!currentUser) return alert('Subiri... Connecting');
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      currentRoom = code;

      await set(ref(db, `rooms/${code}/users/${currentUser.uid}`), {
        name: userName,
        color: userColor,
        joinedAt: Date.now()
      });

      onDisconnect(ref(db, `rooms/${code}/users/${currentUser.uid}`)).remove();
      onDisconnect(ref(db, `rooms/${code}/messages`)).remove();

      // Update URL
      window.history.pushState({}, '', `?room=${code}`);
      startChat(code);
    };

    window.joinRoom = async () => {
      if (!currentUser) return alert('Subiri... Connecting');
      let code = document.getElementById('joinCode').value.trim().toUpperCase();

      // Extract code from link if full URL
      if (code.includes('room=')) {
        code = code.split('room=')[1].substring(0, 6);
      }

      if (!code || code.length!== 6) return alert('Weka room code sahihi (herufi 6)');

      const roomRef = ref(db, `rooms/${code}`);
      const snap = await get(roomRef);
      if (!snap.exists()) return alert('Room haipo au imefutika');

      const users = snap.val().users || {};
      if (Object.keys(users).length >= 3) return alert('Room imejaa. Max watu 3');
      if (users[currentUser.uid]) return alert('Uko ndani ya room tayari');

      currentRoom = code;
      await set(ref(db, `rooms/${code}/users/${currentUser.uid}`), {
        name: userName,
        color: userColor,
        joinedAt: Date.now()
      });

      onDisconnect(ref(db, `rooms/${code}/users/${currentUser.uid}`)).remove();
      window.history.pushState({}, '', `?room=${code}`);
      startChat(code);
    };

    function startChat(code) {
      roomSection.style.display = 'none';
      chatSection.style.display = 'flex';
      document.getElementById('roomCode').textContent = code;

      addSystemMsg(`${userName} amejiunga na room`);

      // Listen for users
      onValue(ref(db, `rooms/${code}/users`), (snap) => {
        const users = snap.val() || {};
        updateUsersList(users);
      });

      // Listen for messages
      onChildAdded(ref(db, `rooms/${code}/messages`), (snap) => {
        const msg = snap.val();
        const msgId = snap.key;
        addMsg(msg, msgId, msg.uid === currentUser.uid? 'me' : 'other');
      });

      // Listen for typing
      onValue(ref(db, `rooms/${code}/typing`), (snap) => {
        const typing = snap.val() || {};
        const typingUsers = Object.entries(typing)
        .filter(([uid, data]) => uid!== currentUser.uid && data.isTyping)
        .map(([uid, data]) => data.name);

        if (typingUsers.length > 0) {
          typingIndicator.textContent = `${typingUsers.join(', ')} anaandika...`;
        } else {
          typingIndicator.textContent = '';
        }
      });
    }

    function updateUsersList(users) {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      Object.entries(users).forEach(([uid, user]) => {
        const badge = document.createElement('div');
        badge.className = 'user-badge';
        badge.innerHTML = `
          <div class="user-avatar" style="background: ${user.color}">${user.name[0].toUpperCase()}</div>
          <span>${user.name}${uid === currentUser.uid? ' (Wewe)' : ''}</span>
        `;
        list.appendChild(badge);
      });
    }

    window.copyLink = () => {
      const link = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
      navigator.clipboard.writeText(link).then(() => {
        showToast('Link imekopiwa! Tuma kwa marafiki');
      });
    };

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    window.handleKeyPress = (e) => {
      if (e.key === 'Enter' &&!e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    };

    window.handleTyping = () => {
      if (!currentRoom) return;

      set(ref(db, `rooms/${currentRoom}/typing/${currentUser.uid}`), {
        name: userName,
        isTyping: true
      });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        set(ref(db, `rooms/${currentRoom}/typing/${currentUser.uid}`), {
          name: userName,
          isTyping: false
        });
      }, 2000);
    };

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file ||!currentRoom) return;

      if (file.size > 6291456) {
        alert('Picha kubwa sana! Max 6MB');
        fileInput.value = '';
        return;
      }

      const oneView = document.getElementById('oneViewCheck').checked;
      statusEl.querySelector('span').textContent = 'Inapakia...';

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;
        await push(ref(db, `rooms/${currentRoom}/messages`), {
          type: 'image',
          url: base64,
          fileName: file.name,
          uid: currentUser.uid,
          uid_name: userName,
          uid_color: userColor,
          timestamp: Date.now(),
          oneView: oneView,
          viewed: false
        });
        statusEl.querySelector('span').textContent = 'Online';
        fileInput.value = '';
        document.getElementById('oneViewCheck').checked = false;
      };
      reader.readAsDataURL(file);
    });

    window.sendMsg = async () => {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text ||!currentRoom) return;

      const oneView = document.getElementById('oneViewCheck').checked;
      await push(ref(db, `rooms/${currentRoom}/messages`), {
        type: 'text',
        text,
        uid: currentUser.uid,
        uid_name: userName,
        uid_color: userColor,
        timestamp: Date.now(),
        oneView: oneView,
        viewed: false
      });
      input.value = '';
      document.getElementById('oneViewCheck').checked = false;

      // Clear typing
      set(ref(db, `rooms/${currentRoom}/typing/${currentUser.uid}`), {
        name: userName,
        isTyping: false
      });
    };

    function addMsg(msg, msgId, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.id = msgId;

      if (msg.oneView && msg.viewed && msg.uid!== currentUser.uid) {
        div.innerHTML = '<i>Ujumbe wa one-view umefutika 🔥</i>';
        div.classList.add('system');
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return;
      }

      let content = '';
      if (type === 'other') {
        content += `<div class="msg-header" style="color: ${msg.uid_color}">${msg.uid_name}</div>`;
      }

      if (msg.type === 'text') {
        content += msg.text;
      } else if (msg.type === 'image') {
        content += `<img src="${msg.url}" class="${msg.oneView? 'oneview' : ''}"
                   onclick="viewOneView('${msgId}', ${msg.oneView})">`;
      }

      if (msg.oneView) {
        content += '<span class="oneview-label">👁️ ONE-VIEW</span>';
      }

      div.innerHTML = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    window.viewOneView = async (msgId, isOneView) => {
      if (!isOneView) return;
      const img = document.querySelector(`#${msgId} img`);
      if (img && img.classList.contains('oneview') &&!img.classList.contains('viewed')) {
        img.classList.add('viewed');
        await update(ref(db, `rooms/${currentRoom}/messages/${msgId}`), { viewed: true });
        setTimeout(() => {
          remove(ref(db, `rooms/${currentRoom}/messages/${msgId}`));
        }, 5000);
      }
    };

    function addSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.textContent = text;
      messagesEl.appendChild(div);
    }

    window.addEventListener('beforeunload', () => {
      if (currentRoom && currentUser) {
        remove(ref(db, `rooms/${currentRoom}/users/${currentUser.uid}`));
      }
    });
  </script>
</body>
</html>
